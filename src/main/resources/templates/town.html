<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg rounded-4 p-4">
                <h3 class="card-title text-center mb-4">Create Town</h3>
                <form method="POST" th:action="@{/town}" th:object="${town}">
                    <input type="hidden" th:field="*{id}">
                    <div class="mb-3">
                        <label for="townName" class="form-label">Town Name</label>
                        <input id="townName" type="text" th:field="*{name}" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Country</label>
                        <select th:field="*{country}" class="form-select">
                            <option value=""> -- Choose Country --</option>
                            <option th:each="country: ${countries}" th:value="${country.id}" th:text="${country.name}">
                            </option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary"> Save Town</button>
                </form>
            </div>
        </div>
    </div>
</div>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg rounded-4 p-4">
                <div class="card-body">
                    <table class="table table-striped table-hover">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Town Name</th>
                            <th>Country</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="town : ${towns}">
                            <td th:text="${town.id}"></td>
                            <td th:text="${town.name}"></td>
                            <td th:text="${town.country.name}"></td>
                            <td>
                                <a th:href="@{/town/edit/{id}(id=${town.id})}"
                                   class="btn btn-warning btn-sm">
                                    Edit
                                </a>

                                <a th:href="@{/town/delete/{id}(id=${town.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Are you sure ?')">
                                    Delete
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
