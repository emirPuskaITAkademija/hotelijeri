<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg rounded-4 p-4">
                <h3 class="card-title text-center mb-4">Create Country</h3>
                <-- HTTP POST request http://localhost:8081/country -->
                <form method="POST" th:action="@{/country}" th:object="${country}">
                    <input type="hidden" th:field="*{id}">
                    <div class="mb-3">
                        <label class="form-label" for="countryName">Country Name</label>
                        <input type="text" th:field="*{name}" class="form-control" id="countryName">
                    </div>
                    <button type="submit" class="btn btn-primary">Save Country</button>
                </form>
            </div>
        </div>
    </div>
</div>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg rounded-4 p-4">
                <table class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Country Name</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="country : ${countries}">
                        <td th:text="${country.id}"></td>
                        <td th:text="${country.name}"></td>
                        <td>
                            <a th:href="@{/country/edit/{id}(id=${country.id})}" class="btn btn-warning btn-sm">
                                Edit
                            </a>
                            <a th:href="@{/country/delete/{id}(id=${country.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure that you want to delete country ? ')">
                                Delete
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <nav th:if="${totalPages > 1}">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage==0}?'disabled'">
                            <a class="page-link"
                               th:href="@{/country(page=${currentPage - 1})}">
                                Previous
                            </a>
                        </li>

                        <li class="page-item"
                            th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/country(page=${currentPage + 1})}">
                                Next
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
</body>
